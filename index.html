<!DOCTYPE html>
<html lang="en">

<head>

  <title>FSMEMES</title>


  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 20px;

    }

    .directory {
      display: block;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .img {
      width: 10vw;
      height: 10vw;
      margin: 10px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
  </style>

</head>

<body>

</body>

<script  type="module">

  import { render, html } from 'https://esm.run/uhtml@5.0.9';

  window.onload = async () => {
  const pathname = window.location.pathname
    .replace(/^\/FSMEMES\/?/, '')
    .replace(/^\/+|\/+$/g, '');

  const apiPath = pathname ? `/${pathname}` : '';

  const apiUrl =
    `https://api.github.com/repos/Foreverender/FSMEMES/contents${apiPath}`;

  console.log("pathname:", pathname);
  console.log("API URL:", apiUrl);

  const response = await fetch(apiUrl);

  if (!response.ok) {
    throw new Error(
      `GitHub API returned ${response.status}: ${await response.text()}`
    );
  }

  const results = await response.json();

    render(document.body, html`
  <div>
    ${results
      .filter(el => el.type === 'dir')
      .map(el => html`
        <a
          class="directory"
          href="${`/FSMEMES${pathname}/${el.name}/`}"
        >${el.name}</a>
      `)}
  </div>

  <div class="gallery">
    ${results
      .filter(el => el.name.match(/\.(gif|jpe?g|tiff?|png|webp|bmp|svg|mp4)$/i))
      .map(el => html`
        <a
          class="img"
          href="${`/FSMEMES${pathname}/${el.name}`}"
          style="background-image: url('${`/FSMEMES${pathname}/${el.name}`}')"
        ></a>
      `)}
  </div>
`);

</script>

</html>
